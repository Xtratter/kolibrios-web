# Locations for the emulator, to include inside your HTTPS server { } block.
# Assumes the site lives in /var/www/html/kolibri and "root /var/www/html;".

location /kolibri/ {
    gzip_static on;
    gzip_vary on;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
}

# Build directories never change once published (new builds get new paths).
# media.img has no .gz on purpose: v86 reads it with HTTP range requests.
location /kolibri/os/ {
    gzip_static on;
    gzip_vary on;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location = /kolibri/os/current.json {
    add_header Cache-Control "no-cache";
}

# Admin page and its backend (kolibri-admin.service); create the password file
# with: printf 'admin:%s\n' "$(openssl passwd -apr1)" > /etc/nginx/kolibri-admin.htpasswd
location /kolibri/admin/ {
    auth_basic "KolibriOS admin";
    auth_basic_user_file /etc/nginx/kolibri-admin.htpasswd;
    add_header Cache-Control "no-store";
    try_files $uri $uri/ =404;
}

location /kolibri/admin/api/ {
    auth_basic "KolibriOS admin";
    auth_basic_user_file /etc/nginx/kolibri-admin.htpasswd;
    proxy_pass http://127.0.0.1:8095/;
    proxy_read_timeout 60s;
}
