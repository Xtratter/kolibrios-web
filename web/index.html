<!doctype html>
<html lang="ru" data-default-lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#1b1b1b">
<title data-i18n="title">KolibriOS в браузере</title>
<style>
  :root { color-scheme: dark; --bg: #111; --bar: #1b1b1b; --line: #333; --btn: #2a2a2a; --btn-hover: #363636; --text: #ddd; --muted: #999; --accent: #4a9eff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  button { background: var(--btn); color: var(--text); border: 1px solid #444; border-radius: 6px;
           padding: 6px 10px; font: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:hover { background: var(--btn-hover); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  header { display: flex; align-items: center; gap: 6px; padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top));
           background: var(--bar); border-bottom: 1px solid var(--line); flex: none; }
  header .brand { font-weight: 600; margin-right: 2px; white-space: nowrap; }
  #version { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #status { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; }
  header svg { width: 18px; height: 18px; flex: none; }
  @media (max-width: 560px) { header .label { display: none; } #version { display: none; } }

  #stage { flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; }
  #screen_container { width: var(--cw, 640px); height: var(--ch, 400px); background: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
  #screen_container canvas { display: block; width: var(--cw, 640px) !important; height: var(--ch, 400px) !important;
                             transform: none !important; image-rendering: auto; }
  #screen_container.crisp canvas { image-rendering: pixelated; }
  #screen_container > div { display: none !important; }

  #keys { display: none; flex: none; gap: 4px; padding: 5px 6px; padding-bottom: max(5px, env(safe-area-inset-bottom));
          background: var(--bar); border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  #keys::-webkit-scrollbar { display: none; }
  body.kbd-on #keys { display: flex; }
  #keys button { flex: none; min-width: 42px; padding: 8px 8px; font-size: 13px; }
  #keys .sep { flex: none; width: 1px; background: var(--line); margin: 2px 2px; }

  body.pad-on #stage { touch-action: none; user-select: none; -webkit-user-select: none;
                       background: radial-gradient(ellipse at center, #1a1a1a 0%, var(--bg) 70%); }
  #btn-pad { display: none; }
  body.touch #btn-pad { display: inline-flex; }
  #mouse-bar { display: none; flex: none; gap: 6px; padding: 6px; background: var(--bar); border-top: 1px solid var(--line); }
  body.pad-on #mouse-bar { display: flex; }
  body.pad-on:not(.kbd-on) #mouse-bar { padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  #mouse-bar button { flex: 2; height: 52px; font-size: 15px; user-select: none; -webkit-user-select: none; touch-action: none; }
  #mouse-bar #btn-dbl { flex: 1; }
  #mouse-bar button.down { background: var(--accent); border-color: var(--accent); color: #fff; }

  #kbd { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0;
         font-size: 16px; resize: none; caret-color: transparent; }

  footer { flex: none; color: #777; font-size: 12px; padding: 5px 12px; text-align: center; }
  body.touch footer, body.kbd-on footer { display: none; }
  @media (max-height: 520px) { footer { display: none; } }

  dialog { background: var(--bar); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 0;
           width: min(460px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); }
  dialog::backdrop { background: rgb(0 0 0 / .55); }
  .menu-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .menu-head b { font-size: 16px; }
  .menu-body { padding: 4px 16px 14px; overflow-y: auto; }
  .menu-body h3 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 14px 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid button { padding: 9px 10px; }
  label.toggle { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  label.toggle input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .note { background: #2a2410; border: 1px solid #5a4a1a; border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 13px;
          display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  ul.help { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  ul.help b { color: var(--text); font-weight: 500; }
  a { color: #8ab; }
</style>
</head>
<body>
<header>
  <span class="brand">KolibriOS</span><span id="version"></span>
  <span id="status" data-i18n="loading">Загрузка…</span>
  <button id="btn-pad" aria-pressed="false" data-i18n-title="pad.title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 14h18M12 14v6"/></svg>
    <span class="label" data-i18n="pad">Тачпад</span>
  </button>
  <button id="btn-kbd" aria-pressed="false" data-i18n-title="kbd">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
    <span class="label" data-i18n="kbd">Клавиатура</span>
  </button>
  <button id="btn-full" data-i18n-title="full.title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <span class="label" data-i18n="full">Экран</span>
  </button>
  <button id="btn-menu" data-i18n-title="menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <span class="label" data-i18n="menu">Меню</span>
  </button>
</header>

<div id="stage">
  <div id="screen_container">
    <div></div>
    <canvas></canvas>
  </div>
</div>

<div id="mouse-bar">
  <button data-btn="0" data-i18n="lmb">ЛКМ</button>
  <button id="btn-dbl" data-i18n-title="dbl.title">2×</button>
  <button data-btn="2" data-i18n="rmb">ПКМ</button>
</div>

<div id="keys">
  <button data-key="Esc">Esc</button>
  <button data-key="Tab">Tab</button>
  <button data-mod="Ctrl" aria-pressed="false">Ctrl</button>
  <button data-mod="Alt" aria-pressed="false">Alt</button>
  <button data-mod="Shift" aria-pressed="false">Shift</button>
  <span class="sep"></span>
  <button data-key="Left">←</button>
  <button data-key="Up">↑</button>
  <button data-key="Down">↓</button>
  <button data-key="Right">→</button>
  <span class="sep"></span>
  <button data-key="Enter">Enter</button>
  <button data-key="Backspace">⌫</button>
  <button data-key="Del">Del</button>
  <button data-key="Home">Home</button>
  <button data-key="End">End</button>
  <button data-key="PgUp">PgUp</button>
  <button data-key="PgDn">PgDn</button>
  <button data-key="Win">Win</button>
  <span class="sep"></span>
  <button data-key="F1">F1</button><button data-key="F2">F2</button><button data-key="F3">F3</button>
  <button data-key="F4">F4</button><button data-key="F5">F5</button><button data-key="F6">F6</button>
  <button data-key="F7">F7</button><button data-key="F8">F8</button><button data-key="F9">F9</button>
  <button data-key="F10">F10</button><button data-key="F11">F11</button><button data-key="F12">F12</button>
</div>
<textarea id="kbd" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-i18n-aria="kbd.aria"></textarea>

<footer data-i18n-html="footer"></footer>

<dialog id="menu">
  <div class="menu-head"><b data-i18n="menu">Меню</b><button id="menu-close" data-i18n-aria="close">✕</button></div>
  <div class="menu-body">
    <h3 data-i18n="h.system"></h3>
    <div class="grid">
      <button id="act-cad">Ctrl+Alt+Del</button>
      <button id="act-reset" data-i18n="reset"></button>
    </div>

    <h3 data-i18n="h.state"></h3>
    <div class="grid">
      <button id="act-save" data-i18n="save"></button>
      <button id="act-load" data-i18n="load"></button>
      <button id="act-export" data-i18n="export"></button>
      <button id="act-import" data-i18n="import"></button>
    </div>
    <input type="file" id="file-in" accept=".gz,.bin,application/gzip" hidden>
    <p class="hint" data-i18n="state.hint"></p>

    <h3 data-i18n="h.media"></h3>
    <label class="toggle">
      <input type="checkbox" id="opt-media">
      <span data-i18n-html="media.desc"></span>
    </label>
    <div class="note" id="media-note" hidden>
      <span data-i18n="media.note"></span>
      <button id="act-apply" data-i18n="apply"></button>
    </div>

    <h3 data-i18n="h.phone"></h3>
    <p class="hint" style="margin:0 0 6px" data-i18n="phone.hint"></p>
    <ul class="help" data-i18n-html="phone.help"></ul>

    <h3 data-i18n="h.lang"></h3>
    <div class="grid" id="lang-list"></div>

    <h3 data-i18n="h.version"></h3>
    <p class="hint" style="margin-top:0" data-i18n-html="version.text"></p>
  </div>
</dialog>

<script src="i18n.js"></script>
<script src="libv86.js"></script>
<script src="kmouse.js"></script>
<script src="kkeys.js"></script>
<script src="app.js"></script>
</body>
</html>
